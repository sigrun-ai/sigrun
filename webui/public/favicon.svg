<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- sigrun favicon — the gull-wing brand mark (candidate A, picked
	     2026-10-31) as the 16px inverse the mockup showed: a baltic-amber
	     tile (#d6a24a, the default accent's dark value) with a fjord-dark
	     (#0b0f13, the default palette's dark bg) stroke at a heavy 2.6 so
	     the wing stays legible at tab size. The 24-grid mark sits at
	     25.6/32 (the mockup's 13-of-16). favicon-32.png is the same
	     geometry — keep the two in step via webui/scripts/render-icons.mjs
	     (whose constants mirror this file). -->
	<rect width="32" height="32" rx="6" fill="#d6a24a"/>
	<g transform="translate(3.2 3.2) scale(1.0667)" fill="none" stroke="#0b0f13" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 16c3.2-1.4 6.9-4.6 8.4-8.4l.6 2.2 2.2.6"/>
		<path d="M8.5 18.5c2.7-1.5 5.4-4.4 6.6-7.4l1.5 1.2 1.9-.3"/>
	</g>
</svg>
