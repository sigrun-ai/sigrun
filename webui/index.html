<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>sigrun</title>
		<script>
			// Pre-paint theme boot (B2): stamp the persisted mode/palette/accent
			// dataset keys before the stylesheet paints so a persisted light mode
			// or accent doesn't flash the dark defaults in `color-scheme`-driven
			// chrome. The full token set is applied by useTheme at mount (the
			// palette data lives only in src/shared/themes.ts — nothing is
			// duplicated here); app.css's :root carries the default palette's
			// dark values as the pre-mount fallback.
			try {
				const mode = localStorage.getItem("sigrun.theme");
				document.documentElement.dataset.mode =
					mode === "light" || mode === "dark"
						? mode
						: matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
				const palette = localStorage.getItem("sigrun.palette");
				if (palette)
					document.documentElement.dataset.palette = palette;
				let accent = localStorage.getItem("sigrun.accent");
				if (accent === "amber") accent = "baltic-amber";
				if (accent) document.documentElement.dataset.accent = accent;
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
