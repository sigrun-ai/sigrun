# Appendix D: worker node placement + RustFS backup target.
#
# The backup env makes config.backup present, so /v1/meta's health.backup
# reads "configured" and the capabilities.backup affordances exist — the app
# process itself never runs a backup (the CronJob does) and needs no AWS
# credentials. Bucket/prefix are instantiate-time choices (App D names the
# endpoint, not the bucket).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigrun
spec:
  template:
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      tolerations:
        - key: node-role.kubernetes.io/dedicated
          operator: Equal
          value: workload
          effect: NoSchedule
      containers:
        - name: sigrun
          env:
            - name: SIGRUN_BACKUP_S3_BUCKET
              value: sigrun
            - name: SIGRUN_BACKUP_S3_PREFIX
              value: backups/
