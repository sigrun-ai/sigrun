# Sigrun homelab overlay (Task 13) — Appendix D of
# docs/superpowers/specs/2026-10-04-sigrun-core.md, instantiated.
#
# Appendix D → overlay mapping (kustomize has no values files; patches are
# the idiom):
#
#   iSCSI block PVC for sqlite          → pvc patch: storageClassName REPLACE-storage-class
#   Tailscale LB sigrun.tayra-…ts.net   → NEW service-tailscale.yaml
#                                          (loadBalancerClass: tailscale +
#                                          tailscale.com/hostname: sigrun)
#   RustFS S3 backup target             → deployment patch: SIGRUN_BACKUP_S3_*
#                                          (meta badge reports "configured");
#                                          cronjob patch: same + endpoint env.
#                                          AWS credentials stay in the
#                                          sigrun-backup Secret (core secret).
#   worker nodeSelector + dedicated     → deployment + cronjob patches
#   toleration                            (both pools tainted; the placement
#                                          stays on the CronJob for
#                                          consistency per Appendix D, even
#                                          though iSCSI block PVCs carry no
#                                          node binding)
#   ServiceMonitor + PrometheusRule      → JSON6902 patches add the
#                                          release: kube-prometheus-stack
#                                          label the cluster's Prometheus
#                                          selects monitors/rules by
#                                          (matches flux-app-llm/gateway/
#                                          service-monitor.yaml)
#
# NOT instantiated: Appendix D's optional separate workspace volume on
# REPLACE-nfs-node — the base keeps the workspace on the sqlite PVC; a later
# overlay revision can split it if artifact volume demand appears.
#
# s3 retention gap (App D names it): run-backup.ts enforces retention only
# for the path target; s3 retention relies on RustFS bucket lifecycle
# (unverified in M1 — App C's named verification). The CronJob comment
# carries the reminder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - service-tailscale.yaml

patches:
  # Appendix D: iSCSI-backed block PVC (block semantics, safe for WAL).
  - path: patch-pvc.yaml
  # Appendix D: worker placement + RustFS backup target (meta badge).
  - path: patch-deployment.yaml
  # Appendix D: worker placement (consistency; iSCSI has no node binding) +
  # RustFS target env for the backup run itself.
  - path: patch-cronjob.yaml

  # The cluster's kube-prometheus-stack selects monitors/rules by this label
  # (see flux-app-llm/gateway/service-monitor.yaml).
  - target:
      kind: ServiceMonitor
      name: sigrun
    patch: |-
      - op: add
        path: /metadata/labels/release
        value: kube-prometheus-stack
  - target:
      kind: PrometheusRule
      name: sigrun
    patch: |-
      - op: add
        path: /metadata/labels/release
        value: kube-prometheus-stack
