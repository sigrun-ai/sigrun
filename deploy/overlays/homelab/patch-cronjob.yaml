# Appendix D: worker placement on the backup CronJob (consistency — iSCSI
# block PVCs carry no node binding) + the RustFS S3 target env for the
# backup run itself.
#
# SIGRUN_BACKUP_S3_ENDPOINT drives run-backup.ts's `aws s3 cp
# --endpoint-url` (RustFS S3 at RUSTFS-ENDPOINT-REMOVED.example.invalid:3900 — the CNPG
# barman precedent). AWS credentials (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY) stay in the sigrun-backup Secret the base already
# envFroms. RETENTION (App D): s3 retention relies on RustFS bucket
# lifecycle, UNVERIFIED in M1 (App C named verification) — verify or add a
# retention step before relying on the 30-day floor.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sigrun-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/worker: ""
          tolerations:
            - key: node-role.kubernetes.io/dedicated
              operator: Equal
              value: workload
              effect: NoSchedule
          containers:
            - name: backup
              env:
                - name: SIGRUN_BACKUP_S3_BUCKET
                  value: sigrun
                - name: SIGRUN_BACKUP_S3_PREFIX
                  value: backups/
                - name: SIGRUN_BACKUP_S3_ENDPOINT
                  value: https://RUSTFS-ENDPOINT-REMOVED.example.invalid:3900
