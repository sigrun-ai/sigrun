# Sigrun Tailscale LB Service (Appendix D: "ClusterIP + Tailscale LB
# (`tailscale` class) at sigrun.tailnet.example.test").
#
# Shape copied from the cluster's live convention
# (monitoring/graphite-exporter-tailscale): spec.loadBalancerClass: tailscale
# + the tailscale.com/hostname annotation — the operator publishes the
# Service at <hostname>.<tailnet-domain> (here: sigrun.tailnet.example.test).
# The base ClusterIP Service stays alongside it for in-cluster traffic and
# the ServiceMonitor. The ServiceMonitor matches Service METADATA labels
# ({name: sigrun, component: server}), so this Service must NOT carry that
# pair — it would become a second scrape target to the same pods (double
# scrapes / duplicated up{} series). Its pod `selector` below still targets
# the server pods; only the metadata labels differ.
apiVersion: v1
kind: Service
metadata:
  name: sigrun-tailscale
  labels:
    app.kubernetes.io/name: sigrun
    # Distinct component: the ServiceMonitor's matchLabels must NOT match.
    app.kubernetes.io/component: tailscale-lb
  annotations:
    tailscale.com/hostname: sigrun
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: sigrun
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
