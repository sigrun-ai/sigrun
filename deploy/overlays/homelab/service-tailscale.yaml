# Sigrun Tailscale LB Service (Appendix D: "ClusterIP + Tailscale LB
# (`tailscale` class) at sigrun.tailnet.example.test").
#
# Shape copied from the cluster's live convention
# (monitoring/graphite-exporter-tailscale): spec.loadBalancerClass: tailscale
# + the tailscale.com/hostname annotation — the operator publishes the
# Service at <hostname>.<tailnet-domain> (here: sigrun.tailnet.example.test).
# The base ClusterIP Service stays alongside it for in-cluster traffic and
# the ServiceMonitor (a ServiceMonitor selects by label; two Services with
# the same selector are fine — only this one is a LoadBalancer).
apiVersion: v1
kind: Service
metadata:
  name: sigrun-tailscale
  labels:
    app.kubernetes.io/name: sigrun
    app.kubernetes.io/component: server
  annotations:
    tailscale.com/hostname: sigrun
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: sigrun
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
