# Sigrun ServiceMonitor (spec §4.4 observability, Task 13) — M1 metrics
# scoping.
#
# SCOPING DECISION (documented in the task report): a real /metrics endpoint
# with §4.4's wedged-state gauges (oldest in-flight submission age, oldest
# waking task age) is a follow-up, NOT M1. In M1 the readiness probe IS the
# scrape target: GET /readyz answers 200 with a single Prometheus-exposition
# gauge line when ready, 503 when not — so a degraded harness (T9e memory/
# provider health) or an unreachable storage line collapses into a failed
# scrape (up == 0), which the PrometheusRule alerts on. /v1/meta stays the
# JSON human/debug surface (boot facts, quarantined extensions) — not
# scrapeable.
#
# jobLabel: the job label takes the Service's app.kubernetes.io/name value
# ("sigrun"), so the PrometheusRule's expressions can match job="sigrun".
# The release label (what a kube-prometheus-stack Prometheus selects
# ServiceMonitors by) is an overlay concern — see overlays/homelab.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sigrun
  labels:
    app.kubernetes.io/name: sigrun
    app.kubernetes.io/component: server
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: sigrun
      app.kubernetes.io/component: server
  endpoints:
    - port: http
      path: /readyz
      interval: 30s
      scrapeTimeout: 10s
