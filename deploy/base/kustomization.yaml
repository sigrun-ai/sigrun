# Sigrun reference deployment, portable base (spec §4.4, Task 13).
#
# Render:      kubectl kustomize deploy/base
# Homelab:     kubectl kustomize deploy/overlays/homelab
#
# No namespace: M1 is render-only; the apply step (a future ops task) owns
# the namespace. The sigrun-env and sigrun-backup Secrets are referenced, not
# defined — they carry core credentials (spec §4.4) and are created by the
# apply step (e.g. SealedSecrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - cronjob-backup.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
