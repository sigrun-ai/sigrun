# Reusable extension release (release workstream Task 2.2): guard → test
# → publish for the 10 sigrun-family extension/provider repos. Callers
# wire this to `push tags v*` plus a `workflow_dispatch` path that either
# re-runs an EXISTING tag (the `tag` input) or dry-runs a SHA (the
# `dry-run` + `dry-run-ref` inputs):
#
#   jobs:
#     release:
#       uses: sigrun-ai/sigrun/.github/workflows/ext-release.yml@main
#       secrets: inherit
#       permissions:
#         id-token: write
#       with:
#         needs-core: true      # only the file:-linked repos
#         dry-run: ${{ inputs.dry-run || false }}
#
# Publishing is OIDC trusted publishing ONLY — no NPM_TOKEN anywhere.
# Trusted publishing validates the CALLER's workflow filename, so every
# caller's file is named release.yml; the reusable workflow's own name
# is not part of the trust configuration.
#
# needs-core: true ONLY for sigrun-ext-mcp, sigrun-ext-curator,
# sigrun-ext-gateway and sigrun-ext-oauth (file:../sigrun dev deps) and
# sigrun-ext-tool-search (file:../sigrun-ext-mcp); see ext-ci.yml for the
# layout contract.
name: ext-release

on:
  workflow_call:
    inputs:
      package-dir:
        description: "Directory holding the extension package (manifest, lock)"
        required: false
        type: string
        default: "."
      needs-core:
        description: "Check out and build core plus the family siblings first"
        required: false
        type: boolean
        default: false
      core-ref:
        description: Test against core main or its latest release
        required: false
        type: string
        default: main
      dry-run:
        description: "Run npm publish --dry-run instead of publishing"
        required: false
        type: boolean
        default: false
      dry-run-ref:
        description: "SHA the guard checks against origin/main when dry-run"
        required: false
        type: string
        default: ""
      tag:
        description: >-
          Existing v<semver> tag to re-release (workflow_dispatch re-run
          of an existing tag); empty on a tag push, where the pushed tag
          itself is the release target.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  # The guard runs BEFORE anything builds or publishes: tag shape,
  # tag == manifest version, and ancestry against origin/main.
  guard:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.resolve.outputs.refs }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The repo under test with FULL history — the default fetch-depth 1
      # leaves origin/main absent and the ancestry check fails closed.
      #
      # It must be checked out FIRST: actions/checkout cleans the worktree
      # by default (git clean -ffdx), so a checkout that runs after the
      # tooling one deletes .sigrun-tools. That is exactly how the first
      # pilot tag failed — "Cannot find module
      # .../.sigrun-tools/scripts/release-guard.mjs".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # release-guard.mjs is dependency-free, but ci-core-ref.mjs imports
      # semver. The sparse checkout has no node_modules; resolve installs it.
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun
          ref: main
          path: .sigrun-tools
          clean: false
      - name: Resolve the core and family refs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # Core's root manifest has file: sibling links that dangle here;
          # remove it and its lockfile because this install only needs semver.
          rm -f .sigrun-tools/package.json .sigrun-tools/package-lock.json
          npm install --prefix .sigrun-tools --no-save semver@^7
          refs="$(
            node .sigrun-tools/scripts/ci-core-ref.mjs \
              '${{ inputs['core-ref'] }}'
          )"
          [ -n "$refs" ] || refs='{}'
          {
            echo 'refs<<EOF'
            echo "$refs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Fetch origin/main for the ancestry check
        run: git fetch origin main:refs/remotes/origin/main
      - name: Resolve the tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            # Dry runs exercise --dry-run-ref instead; no tag applies.
            echo "tag=" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            # Dispatch re-run of an EXISTING tag: github.ref_name is the
            # branch the dispatch ran from (e.g. main), never the tag —
            # the caller's explicit tag input wins.
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            # Tag push: the pushed tag itself is the release target.
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: "Guard: tag, manifest version, ancestry"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            git fetch --depth 1 origin "${{ inputs.dry-run-ref }}"
            node .sigrun-tools/scripts/release-guard.mjs \
              --dry-run-ref "${{ inputs.dry-run-ref }}" \
              v0.0.0-dry-run \
              "${{ inputs.package-dir }}/package.json"
          else
            tag="${{ steps.tag.outputs.tag }}"
            git fetch origin "+refs/tags/${tag}:refs/tags/${tag}"
            node .sigrun-tools/scripts/release-guard.mjs \
              "$tag" \
              "${{ inputs.package-dir }}/package.json"
          fi

  test:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check whether ci already passed for the tag's commit
        id: ci-passed
        shell: bash
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          skip=false
          run_id=
          sha=
          if [ -n "$TAG" ]; then
            # Resolve the annotated tag to its commit; a dispatch re-run's
            # triggering SHA is the branch head, not the tag's commit.
            remote_ref="$(git ls-remote origin "refs/tags/${{ needs.guard.outputs.tag }}" | head -n 1 | cut -f 1 || true)"
            if [ -n "$remote_ref" ]; then
              sha="$(git rev-parse "${remote_ref}^{}" 2>/dev/null || printf '%s' "$remote_ref")"
            fi
          fi
          if [ -n "$sha" ]; then
            # Fail open: any lookup problem leaves skip=false so tests run.
            response="$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${sha}&status=success" || true)"
            if [ -n "$response" ]; then
              run_id="$(printf '%s' "$response" | jq -r 'first(.workflow_runs[] | select(.name == "ci") | .id) // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$run_id" ]; then
            skip=true
            echo "::notice::tests already passed for ${sha} in ci run ${run_id}"
          fi
          {
            echo "skip=${skip}"
            echo "run_id=${run_id}"
          } >> "$GITHUB_OUTPUT"
      - if: steps.ci-passed.outputs.skip != 'true'
        uses: sigrun-ai/sigrun/.github/actions/ext-test@main
        with:
          package-dir: ${{ inputs.package-dir }}
          needs-core: ${{ inputs.needs-core }}
          core-ref: ${{ inputs['core-ref'] }}
          repo: ${{ github.event.repository.name }}
          refs: ${{ needs.guard.outputs.refs }}
          ref: >-
            ${{
              inputs.dry-run && inputs.dry-run-ref
              || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag)
              || github.ref)
            }}

  publish:
    needs: [guard, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: "!inputs.needs-core"
        with:
          ref: >-
            ${{
              inputs.dry-run && inputs.dry-run-ref
              || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag)
              || github.ref)
            }}
      - uses: actions/checkout@v5
        if: inputs.needs-core
        with:
          repository: sigrun-ai/sigrun
          ref: ${{ fromJSON(needs.guard.outputs.refs).sigrun || '' }}
          path: sigrun
      - name: Check out the built-in family siblings
        if: inputs.needs-core
        uses: sigrun-ai/sigrun/.github/actions/family-checkout@main
        with:
          exclude: ${{ github.event.repository.name }}
          refs: ${{ needs.guard.outputs.refs }}
      - uses: actions/checkout@v5
        if: inputs.needs-core
        with:
          path: ${{ github.event.repository.name }}
          ref: >-
            ${{
              inputs.dry-run && inputs.dry-run-ref
              || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag)
              || github.ref)
            }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build core and the built-in siblings (file:-linked repos)
        if: inputs.needs-core
        run: |
          # Core plus every built-in sibling the file: links resolve into:
          # the links point at the sibling CHECKOUTS, so their deps must be
          # installed there too (pi-durable 1.5.0: ext-mcp's dist imports
          # typebox at runtime, resolved from its own node_modules).
          npm ci --prefix sigrun && (cd sigrun && npm run build)
          for repo in sigrun-ext-codemode sigrun-ext-curator \
            sigrun-ext-gateway sigrun-ext-mcp sigrun-ext-oauth \
            sigrun-memory-markdown; do
            if [ -d "$repo" ] && [ "$repo" != "${{ github.event.repository.name }}" ]; then
              npm ci --prefix "$repo" >/dev/null 2>&1 || npm install --prefix "$repo" >/dev/null 2>&1 || true
            fi
          done
      - name: Resolve the package working directory
        id: workdir
        shell: bash
        env:
          REPO: ${{ github.event.repository.name }}
          PKGDIR: ${{ inputs.package-dir }}
        run: |
          if [ "${{ inputs.needs-core }}" = "true" ]; then
            echo "dir=${REPO}/${PKGDIR}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${PKGDIR}" >> "$GITHUB_OUTPUT"
          fi
      # npm 11.21+ is the OIDC trusted-publishing-capable line; the
      # runner's bundled npm may be older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.21
      - name: Install
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: npm ci
      # Idempotency: a tag re-run after a partial failure must not error
      # on "version already published". The tarball URL 200s only once
      # the registry serves the version; skip cleanly in that case.
      - name: Check whether the version is already live
        id: live
        shell: bash
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          ver="$(node -p 'require("./package.json").version')"
          base="${name##*/}"
          url="https://registry.npmjs.org/${name}/-/${base}-${ver}.tgz"
          if curl -sf -o /dev/null "$url"; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      # Prereleases (-rc.N etc.) publish under --tag next, never onto
      # latest; releases publish to latest by default.
      - name: Publish (trusted publishing, OIDC)
        if: steps.live.outputs.live == 'false' && !inputs.dry-run
        working-directory: ${{ steps.workdir.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ver="$(node -p 'require("./package.json").version')"
          case "$ver" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
      - name: Publish (dry run)
        if: steps.live.outputs.live == 'false' && inputs.dry-run
        working-directory: ${{ steps.workdir.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ver="$(node -p 'require("./package.json").version')"
          case "$ver" in
            *-*) npm publish --access public --tag next --dry-run ;;
            *)   npm publish --access public --dry-run ;;
          esac
