# Release (CORE): on v<semver> tags (and workflow_dispatch re-runs of an
# EXISTING tag) — publish the npm family (trusted publishing ONLY: no
# npm token secret anywhere; publishing jobs declare id-token: write),
# wait for the registry to serve every tarball, smoke the registry
# install, then build and push the multi-arch image to GHCR. Auth is the
# workflow's own GITHUB_TOKEN (permissions below) — no PATs, no stored
# secrets.
#
# The CHART is NOT released here — it has its own version line and its own
# workflow (chart-release.yml, `chart-v*` tags). A core release that also
# ships a chart is two tags on one commit; see charts/sigrun/RELEASE.md.
# Runbook (bump/tag order, dry runs, re-run semantics, idempotency
# boundary): charts/sigrun/RELEASE.md.
#
# Job graph (the guard stays FIRST everywhere — every job reaches it
# transitively through needs):
#
#   guard -> sandbox -> publish-npm -> await-registry -> smoke -> image
#
# In dry-run mode (`workflow_dispatch` with dry-run: true) the `ref`
# input replaces `tag`, nothing is pushed or published, await-registry
# and smoke are skipped, and image builds WITHOUT pushing (its dry-run
# needs-join is publish-npm, since a skipped smoke would otherwise
# cascade-skip it).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # NOT required: a dry run uses `ref` instead and has no tag. A real
        # dispatch needs it, and the guard resolves it from here, from the
        # pushed tag, or (dry-run) from `ref`.
        description: "Existing v<semver> tag to re-release (ignored on dry-run)"
        required: false
        type: string
        default: ""
      dry-run:
        description: >-
          Exercise the whole graph against `ref` without pushing or
          publishing
        required: true
        type: boolean
        default: false
      ref:
        description: >-
          main-ref the dry run releases (guard: must be an ancestor of
          origin/main)
        required: true
        type: string
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  # The guard runs BEFORE anything builds or publishes: in tag mode the
  # tag must exist as an exact refs/tags ref, equal the manifest
  # version, and be reachable from origin/main; in dry-run mode the
  # `ref` input must be an ancestor of origin/main (no tag exists yet
  # by definition). One job, one shared release-guard.mjs call — the
  # duplicated inline guard the image job used to carry is gone.
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      dry: ${{ steps.resolve.outputs.dry }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # Tooling checkout: release-guard.mjs and await-registry.mjs live
      # here and are dependency-free (node: built-ins only), so a dry
      # run against an old ref still finds the CURRENT scripts — no
      # npm ci in .sigrun-tools.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .sigrun-tools
      # Resolve the release coordinates: the pushed tag, the dispatch's
      # existing-tag input, or the dry-run ref. The guard reads them.
      - name: Resolve release coordinates
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY: ${{ inputs.dry-run }}
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${INPUT_DRY}" = "true" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
          elif [ -n "${INPUT_TAG}" ]; then
            # Dispatch re-run of an EXISTING tag: github.ref_name is the
            # branch the dispatch ran from (e.g. main), never the tag —
            # the explicit tag input wins.
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            # Tag push: the pushed tag itself is the release target.
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      # The workspace the guard runs in: the tag (tag mode) or the
      # dry-run ref, with FULL history — the ancestry check needs
      # origin/main, and the default fetch-depth 1 leaves it absent
      # (a guard that cannot verify ancestry fails closed, by design).
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{
              steps.resolve.outputs.dry == 'true'
              && steps.resolve.outputs.ref
              || format('refs/tags/{0}', steps.resolve.outputs.tag)
            }}
          path: sigrun
          fetch-depth: 0
      - name: "Guard: tag shape, manifest version, ancestry"
        shell: bash
        working-directory: sigrun
        env:
          GUARD_TAG: ${{ steps.resolve.outputs.tag }}
          GUARD_DRY: ${{ steps.resolve.outputs.dry }}
          GUARD_REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if [ "${GUARD_DRY}" = "true" ]; then
            # Dry run: no tag applies; only the candidate SHA's
            # ancestry matters.
            node ../.sigrun-tools/scripts/release-guard.mjs \
              --dry-run-ref "${GUARD_REF}" \
              v0.0.0-dry-run \
              package.json
            # Belt: the checked-out ref IS the ref the guard accepted.
            test "$(git rev-parse HEAD)" = "${GUARD_REF}"
          else
            # Tag mode: the tag must exist as an exact refs/tags ref
            # (releases build EXISTING tags only), match the manifest
            # version, and be an ancestor of origin/main. The
            # exact-match belt is --tags-safe: the runbook's `git tag
            # v<semver>` form is lightweight.
            git fetch origin \
              "+refs/tags/${GUARD_TAG}:refs/tags/${GUARD_TAG}"
            git rev-parse -q --verify \
              "refs/tags/${GUARD_TAG}^{commit}" >/dev/null
            git describe --tags --exact-match "${GUARD_TAG}" >/dev/null
            node ../.sigrun-tools/scripts/release-guard.mjs \
              "${GUARD_TAG}" \
              package.json
          fi
          echo "release coordinates OK (dry=${GUARD_DRY})"

  # The musl sandbox build, from the single reusable workflow ci.yml
  # also consumes — the release never rebuilds a different binary.
  sandbox:
    needs: guard
    uses: ./.github/workflows/sandbox-build.yml

  # Publish the five core-family npm packages, LEAF-FIRST: a failure
  # part-way never leaves a live core pointing at a missing family
  # version. Order: sandbox-linux-x64, sandbox-linux-arm64 (from the
  # reusable build's packed tarballs), @sigrun/shared, @sigrun/tui,
  # then @sigrun/sigrun (registry mode via its existing prepublishOnly
  # dance). Every step is skip-if-live (the tarball-URL curl probe is
  # the same idempotency contract ext-release.yml's live-check uses)
  # and dry-run-aware (npm publish --dry-run exercises the pack path
  # without publishing). Prereleases publish every package with
  # --tag next, the same rule as ext-release.yml (T2.2).
  #
  # Publishing is OIDC trusted publishing ONLY — no npm token secret anywhere.
  publish-npm:
    needs: [guard, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY: ${{ inputs.dry-run || false }}
    steps:
      # Tooling checkout (same contract as the guard job).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .sigrun-tools
      # The release workspace: the tag (or dry-run ref), in the sibling
      # layout the registry-mode dance needs (publish-deps.mjs's
      # manifest reads resolve against the workspace root; the
      # composite action checks out ONLY the siblings — never core).
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{
              needs.guard.outputs.dry == 'true'
              && needs.guard.outputs.ref
              || format('refs/tags/{0}', needs.guard.outputs.tag)
            }}
          path: sigrun
          fetch-depth: 0
      - uses: ./sigrun/.github/actions/family-checkout
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # npm 11.21+ is the OIDC trusted-publishing-capable line; the
      # runner's bundled npm may be older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.21
      # The packed platform tarballs the reusable sandbox build
      # assembled (bin/ already chmod +x'd and npm pack'ed there).
      - name: Download the sandbox musl packages
        uses: actions/download-artifact@v5
        with:
          name: sigrun-sandbox-musl
          path: sandbox-artifacts
      - name: Derive the release versions
        shell: bash
        run: |
          set -euo pipefail
          core="$(node -p 'require("./sigrun/package.json").version')"
          shared="$(node -p 'require("./sigrun/shared/package.json").version')"
          tui="$(node -p 'require("./sigrun/tui/package.json").version')"
          x64p="./sigrun/sandbox/npm/linux-x64/package.json"
          armp="./sigrun/sandbox/npm/linux-arm64/package.json"
          sbx="$(node -p "require('${x64p}').version")"
          sba="$(node -p "require('${armp}').version")"
          {
            echo "CORE_VERSION=${core}"
            echo "SHARED_VERSION=${shared}"
            echo "TUI_VERSION=${tui}"
            echo "SANDBOX_X64_VERSION=${sbx}"
            echo "SANDBOX_ARM64_VERSION=${sba}"
          } >> "$GITHUB_ENV"
      # Pre-check: every built-in pin must already be live — extension
      # releases publish independently, and core's registry-mode
      # manifest resolves to their pinned versions. One-shot: a missing
      # pin fails fast here instead of mid-publish.
      - name: "Pre-check: every built-in pin is live"
        shell: bash
        working-directory: sigrun
        run: |
          set -euo pipefail
          pins="$(node scripts/publish-deps.mjs pins)"
          node ../.sigrun-tools/scripts/await-registry.mjs \
            --timeout-min 0 ${pins}
      # Leaves first. The sandbox platform tarballs publish STRAIGHT
      # from the artifact (npm publish <tarball> uploads it verbatim —
      # repacking would rebuild bin/ permissions against the runner's
      # umask for no gain).
      - name: "Publish @sigrun/sandbox-linux-x64 (skip-if-live)"
        shell: bash
        run: |
          set -euo pipefail
          base="https://registry.npmjs.org/@sigrun/sandbox-linux-x64/-"
          url="${base}/sandbox-linux-x64-${SANDBOX_X64_VERSION}.tgz"
          if curl -sf -o /dev/null "${url}"; then
            echo "sandbox-linux-x64@${SANDBOX_X64_VERSION} live — skip"
          else
            # The artifact's internal layout depends on upload-artifact's
            # least-common-ancestor rule for sandbox-build.yml's four
            # paths (it lands under sandbox-artifacts/npm/linux-x64/), so
            # find by NAME rather than assuming a depth. Empty is fatal:
            # publishing an empty path would fail obscurely later.
            tarball="$(find sandbox-artifacts -type f -name '*linux-x64*.tgz' | head -n 1)"
            if [ -z "${tarball}" ]; then
              echo "::error::no linux-x64 sandbox tarball in the sigrun-sandbox-musl artifact"
              find sandbox-artifacts -type f | sort >&2
              exit 1
            fi
            if [ "${DRY}" = "true" ]; then
              npm publish --dry-run "${tarball}"
            else
              case "${SANDBOX_X64_VERSION}" in
                *-*) npm publish "${tarball}" --tag next ;;
                *)   npm publish "${tarball}" ;;
              esac
            fi
          fi
      - name: "Publish @sigrun/sandbox-linux-arm64 (skip-if-live)"
        shell: bash
        run: |
          set -euo pipefail
          base="https://registry.npmjs.org/@sigrun/sandbox-linux-arm64/-"
          url="${base}/sandbox-linux-arm64-${SANDBOX_ARM64_VERSION}.tgz"
          if curl -sf -o /dev/null "${url}"; then
            echo "sandbox-linux-arm64@${SANDBOX_ARM64_VERSION} live — skip"
          else
            tarball="$(find sandbox-artifacts -type f -name '*linux-arm64*.tgz' | head -n 1)"
            if [ -z "${tarball}" ]; then
              echo "::error::no linux-arm64 sandbox tarball in the sigrun-sandbox-musl artifact"
              find sandbox-artifacts -type f | sort >&2
              exit 1
            fi
            if [ "${DRY}" = "true" ]; then
              npm publish --dry-run "${tarball}"
            else
              case "${SANDBOX_ARM64_VERSION}" in
                *-*) npm publish "${tarball}" --tag next ;;
                *)   npm publish "${tarball}" ;;
              esac
            fi
          fi
      - name: "Publish @sigrun/shared (skip-if-live)"
        shell: bash
        working-directory: sigrun/shared
        run: |
          set -euo pipefail
          base="https://registry.npmjs.org/@sigrun/shared/-"
          url="${base}/shared-${SHARED_VERSION}.tgz"
          if curl -sf -o /dev/null "${url}"; then
            echo "@sigrun/shared@${SHARED_VERSION} live — skip"
          elif [ "${DRY}" = "true" ]; then
            case "${SHARED_VERSION}" in
              *-*) npm publish --access public --tag next --dry-run ;;
              *)   npm publish --access public --dry-run ;;
            esac
          else
            case "${SHARED_VERSION}" in
              *-*) npm publish --access public --tag next ;;
              *)   npm publish --access public ;;
            esac
          fi
      - name: "Publish @sigrun/tui (skip-if-live)"
        shell: bash
        working-directory: sigrun/tui
        run: |
          set -euo pipefail
          base="https://registry.npmjs.org/@sigrun/tui/-"
          url="${base}/tui-${TUI_VERSION}.tgz"
          if curl -sf -o /dev/null "${url}"; then
            echo "@sigrun/tui@${TUI_VERSION} live — skip"
          elif [ "${DRY}" = "true" ]; then
            case "${TUI_VERSION}" in
              *-*) npm publish --access public --tag next --dry-run ;;
              *)   npm publish --access public --dry-run ;;
            esac
          else
            case "${TUI_VERSION}" in
              *-*) npm publish --access public --tag next ;;
              *)   npm publish --access public ;;
            esac
          fi
      # Core LAST: its published manifest pins every family version
      # above, so a live core never points at a missing leaf. The
      # existing prepublishOnly runs the registry-mode dance
      # (publish-deps.mjs registry, then build + webui build);
      # postpublish restores file: specifiers. --dry-run exercises the
      # same lifecycle scripts without publishing.
      - name: "Publish @sigrun/sigrun (skip-if-live, prepublishOnly)"
        shell: bash
        working-directory: sigrun
        run: |
          set -euo pipefail
          base="https://registry.npmjs.org/@sigrun/sigrun/-"
          url="${base}/sigrun-${CORE_VERSION}.tgz"
          if curl -sf -o /dev/null "${url}"; then
            echo "@sigrun/sigrun@${CORE_VERSION} live — skip"
            exit 0
          fi
          # The registry-mode dance needs the lock's built-ins to be
          # registry-shaped too (a link:-shaped lock keeps the dance's
          # npm ci from materializing the built-ins at build time).
          # --save-exact: a bare `npm install <name>@<version>` REWRITES
          # the manifest spec to a caret range, which would both publish
          # a `^0.1.1` dependency and fail core's own manifest gate
          # (test/package-manifest.test.ts accepts only an exact version
          # or the file: dev shape).
          #
          # The manifest stays in registry mode THROUGH `npm ci`: `npm ci`
          # requires the manifest and lock to agree, so restoring file:
          # specifiers here would abort with EUSAGE ("Missing:
          # <name>@<version> from lock file"). postpublish restores
          # file: mode after the publish, which is the only point that
          # needs it.
          node scripts/publish-deps.mjs registry
          pins="$(node scripts/publish-deps.mjs pins)"
          npm install --save-exact ${pins} --package-lock-only
          npm ci
          if [ "${DRY}" = "true" ]; then
            case "${CORE_VERSION}" in
              *-*) npm publish --access public --tag next --dry-run ;;
              *)   npm publish --access public --dry-run ;;
            esac
          else
            case "${CORE_VERSION}" in
              *-*) npm publish --access public --tag next ;;
              *)   npm publish --access public ;;
            esac
          fi
          # postpublish already restored file: mode; make the tree clean
          # again even on a failure path so later jobs read a dev-shape
          # manifest.
          node scripts/publish-deps.mjs file

  # Registry propagation lag only: publish's submit returning 200 does
  # NOT mean every CDN edge serves the tarball yet. Skipped on dry-run
  # (nothing was published).
  await-registry:
    # guard joins for the tag/dry outputs (needs contexts expose only
    # DIRECT dependencies' outputs).
    needs: [publish-npm, guard]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .sigrun-tools
      # Read-only workspace for the versions (no builds here).
      - uses: actions/checkout@v5
        with:
          ref: "refs/tags/${{ needs.guard.outputs.tag }}"
          path: sigrun
      - name: "Wait for every core-family tarball to go live (15 min)"
        shell: bash
        working-directory: sigrun
        run: |
          set -euo pipefail
          core="$(node -p 'require("./package.json").version')"
          shared="$(node -p 'require("./shared/package.json").version')"
          tui="$(node -p 'require("./tui/package.json").version')"
          x64p="./sandbox/npm/linux-x64/package.json"
          armp="./sandbox/npm/linux-arm64/package.json"
          sbx="$(node -p "require('${x64p}').version")"
          sba="$(node -p "require('${armp}').version")"
          node ../.sigrun-tools/scripts/await-registry.mjs \
            --timeout-min 15 \
            "@sigrun/sandbox-linux-x64@${sbx}" \
            "@sigrun/sandbox-linux-arm64@${sba}" \
            "@sigrun/shared@${shared}" \
            "@sigrun/tui@${tui}" \
            "@sigrun/sigrun@${core}"

  # The registry-install smoke: prove the PUBLISHED tarball installs and
  # boots from the registry with every built-in loaded.
  smoke:
    needs: [await-registry, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .sigrun-tools
      - uses: actions/checkout@v5
        with:
          ref: "refs/tags/${{ needs.guard.outputs.tag }}"
          path: sigrun
      - name: Smoke the registry install
        shell: bash
        working-directory: sigrun
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          sh scripts/smoke-registry.sh "${version}"

  image:
    # smoke on a real release; publish-npm joins so a dry run (where
    # smoke is skipped) still builds the image.
    needs: [publish-npm, smoke, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "refs/tags/${{ needs.guard.outputs.tag }}"
          path: sigrun
          fetch-depth: 0
      - uses: ./sigrun/.github/actions/family-checkout
      - name: Derive image tag (v prefix stripped)
        shell: bash
        env:
          GUARD_TAG: ${{ needs.guard.outputs.tag }}
          DRY: ${{ needs.guard.outputs.dry }}
        run: |
          set -euo pipefail
          # A dry run has no tag (the guard resolves a ref instead), so an
          # empty VERSION would silently tag the build ":" and stamp
          # APP_VERSION="" — a dry run that proves nothing about the real
          # release path. Fall back to a clearly-marked sentinel.
          version="${GUARD_TAG#v}"
          if [ "${DRY}" = "true" ] || [ -z "${version}" ]; then
            version="0.0.0-dryrun"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # QEMU: the arm64 half of the multi-arch build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile's build precondition: registry-shaped manifest
      # and lock — identical dance to ci.yml's image-build job (the
      # pins come from publish-deps.mjs's read-only `pins` mode and are
      # named explicitly; a bare --package-lock-only keeps link: entries
      # → dangling built-in symlinks → boot quarantine).
      - name: Registry-mode lock regen
        shell: bash
        working-directory: sigrun
        run: |
          node scripts/publish-deps.mjs registry
          pins="$(node scripts/publish-deps.mjs pins)"
          npm install --save-exact ${pins} --package-lock-only
      - uses: docker/login-action@v3
        if: ${{ needs.guard.outputs.dry != 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sigrun
          platforms: linux/amd64,linux/arm64
          # Dry runs BUILD but never push.
          push: ${{ needs.guard.outputs.dry != 'true' }}
          # Image tags carry the semver WITHOUT the v prefix, and so
          # does the APP_VERSION build-arg (the Dockerfile's version
          # label) — image tag and docker inspect label both read the
          # same 0.1.5 form. (The chart's appVersion reads this release's
          # version separately, in chart-release.yml.)
          tags: |
            ghcr.io/sigrun-ai/sigrun:${{ env.VERSION }}
            ghcr.io/sigrun-ai/sigrun:latest
          build-args: APP_VERSION=${{ env.VERSION }}
