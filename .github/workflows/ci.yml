# CI: tests (sibling checkout), image build check (no push — publishing
# is release-time, Task 8), chart lint.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Sibling layout: the file:../sigrun-ext-* built-in specifiers
      # resolve against the workspace root (npm ci works verbatim).
      - uses: actions/checkout@v5
        with:
          path: sigrun
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-codemode
          path: sigrun-ext-codemode
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-mcp
          path: sigrun-ext-mcp
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-tool-search
          path: sigrun-ext-tool-search
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-oauth
          path: sigrun-ext-oauth
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sigrun/package-lock.json
      # The manifests suites run `helm` from PATH to render charts/sigrun.
      - uses: azure/setup-helm@v4
      # The vendored common-5.2.1.tgz is gitignored — fetch it before the
      # manifests suites render the chart.
      - run: helm dependency update charts/sigrun
        working-directory: sigrun
      - run: npm ci
        working-directory: sigrun
      # The suite imports @sigrun/shared subpaths (access, blocks) through
      # shared/dist — gitignored build output, absent in a fresh checkout.
      # A bare `npm test` only passes against a tree that was built at some
      # point; CI starts from nothing, so build first (this also chains the
      # root tsc build, which the extension-dts contract test asserts).
      - run: npm run build
        working-directory: sigrun
      - run: npm test
        working-directory: sigrun
      - run: npm run typecheck
        working-directory: sigrun

  sandbox-it:
    runs-on: ubuntu-24.04
    steps:
      # The file:../sigrun-ext-* dependencies and shared/dist build outputs
      # must exist before the real serve() child can boot.
      - uses: actions/checkout@v5
        with:
          path: sigrun
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-codemode
          path: sigrun-ext-codemode
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-mcp
          path: sigrun-ext-mcp
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-tool-search
          path: sigrun-ext-tool-search
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-oauth
          path: sigrun-ext-oauth
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sigrun/package-lock.json
      - run: npm ci
        working-directory: sigrun
      - run: npm run build
        working-directory: sigrun
      - name: Build the kernel integration helper
        working-directory: sigrun/sandbox
        run: cargo build --locked --release
      # Hard gate, deliberately before vitest: a runner without Landlock ABI 6
      # fails this job rather than converting every boundary test to a skip.
      - name: Require Landlock ABI 6 or newer
        run: |
          probe="$(sigrun/sandbox/target/release/sigrun-sandbox probe)"
          printf '%s\n' "$probe"
          abi="$(node -e '
            const value = JSON.parse(process.argv[1]);
            if (!Number.isInteger(value.abi)) process.exit(2);
            process.stdout.write(String(value.abi));
          ' "$probe")"
          if [ "$abi" -lt 6 ]; then
            printf 'sandbox-it requires ABI >= 6; got %s\n' "$abi" >&2
            exit 1
          fi
      - run: SIGRUN_SANDBOX_IT=1 npx vitest run test/sandbox-it
        working-directory: sigrun

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install musl and the arm64 cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - run: cargo test --locked
        working-directory: sandbox
      - run: cargo clippy --locked -- -D warnings
        working-directory: sandbox
      - name: Build the x64 musl helper
        working-directory: sandbox
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Build the arm64 musl helper
        working-directory: sandbox
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-musl
      - name: Assemble the platform packages
        run: |
          mkdir -p sandbox/npm/linux-x64/bin sandbox/npm/linux-arm64/bin
          cp sandbox/target/x86_64-unknown-linux-musl/release/sigrun-sandbox \
            sandbox/npm/linux-x64/bin/sigrun-sandbox
          cp sandbox/target/aarch64-unknown-linux-musl/release/sigrun-sandbox \
            sandbox/npm/linux-arm64/bin/sigrun-sandbox
          chmod +x sandbox/npm/linux-x64/bin/sigrun-sandbox \
            sandbox/npm/linux-arm64/bin/sigrun-sandbox
      - name: Pack the x64 platform package
        working-directory: sandbox/npm/linux-x64
        run: npm pack
      - name: Pack the arm64 platform package
        working-directory: sandbox/npm/linux-arm64
        run: npm pack
      - name: Upload musl helpers and platform packages
        uses: actions/upload-artifact@v4
        with:
          name: sigrun-sandbox-musl
          path: |
            sandbox/target/x86_64-unknown-linux-musl/release/sigrun-sandbox
            sandbox/target/aarch64-unknown-linux-musl/release/sigrun-sandbox
            sandbox/npm/linux-x64/*.tgz
            sandbox/npm/linux-arm64/*.tgz

  image-build:
    runs-on: ubuntu-latest
    steps:
      # Siblings again: publish-deps.mjs reads each ext checkout's own
      # manifest for the registry pin it writes into package.json.
      - uses: actions/checkout@v5
        with:
          path: sigrun
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-codemode
          path: sigrun-ext-codemode
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-mcp
          path: sigrun-ext-mcp
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-tool-search
          path: sigrun-ext-tool-search
      - uses: actions/checkout@v5
        with:
          repository: sigrun-ai/sigrun-ext-oauth
          path: sigrun-ext-oauth
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile's build precondition: registry-shaped manifest +
      # lock. The lock regen must name the built-ins explicitly — a bare
      # `npm install --package-lock-only` keeps the lock's `link:` entries
      # and npm ci inside the image then materializes dangling
      # ../sigrun-ext-* symlinks (every built-in quarantines at boot, the
      # failure this dance exists to prevent). The pins are what
      # publish-deps.mjs just wrote into package.json.
      - name: Registry-mode lock regen
        shell: bash
        working-directory: sigrun
        run: |
          node scripts/publish-deps.mjs registry
          # Read back the pins publish-deps.mjs just wrote into package.json
          # (each sourced from the sibling checkout's own manifest).
          pins="$(node -p "
            const d = require('./package.json').dependencies;
            const names = [
              '@sigrun/ext-codemode',
              '@sigrun/ext-mcp',
              '@sigrun/ext-tool-search',
              '@sigrun/oauth',
            ];
            names.map((n) => n + '@' + d[n]).join(' ');
          ")"
          npm install ${pins} --package-lock-only
      - uses: docker/build-push-action@v6
        with:
          context: sigrun
          platforms: linux/amd64
          push: false
          load: true
          tags: sigrun:ci-check
      - name: Smoke-check the runtime image
        working-directory: sigrun
        run: sh scripts/smoke-image.sh sigrun:ci-check

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sigrun
      - uses: azure/setup-helm@v4
      # The vendored common tgz is gitignored — CI must fetch it.
      - run: |
          helm dependency update charts/sigrun
          helm lint charts/sigrun
          helm template charts/sigrun
        working-directory: sigrun
