# Reusable extension CI (release workstream Task 2.2): build, test and
# typecheck for the 10 sigrun-family extension/provider repos, so the
# caller repos carry a ~15-line thin caller instead of a drifting copy.
#
# Callers:
#
#   jobs:
#     test:
#       uses: sigrun-ai/sigrun/.github/workflows/ext-ci.yml@main
#       with:
#         needs-core: true   # only the file:-linked repos
#
# needs-core is true ONLY for the repos whose devDependencies hold a
# file:../ sibling spec (ext-mcp/ext-curator/ext-gateway/ext-oauth ->
# sigrun, ext-tool-search -> sigrun-ext-mcp). The shared ext-test action
# owns the sibling layout and builds core first so file: links resolve
# against real build output. The repo under test is ALWAYS the caller's
# own checkout at the triggering SHA — never a family-checkout
# default-branch checkout. core-ref: release pins non-built-ins to the
# latest released core and its companion tags instead of core main.
name: ext-ci

on:
  workflow_call:
    inputs:
      package-dir:
        description: "Directory holding the extension package (manifest, lock)"
        required: false
        type: string
        default: "."
      needs-core:
        description: "Check out and build core plus the family siblings first"
        required: false
        type: boolean
        default: false
      core-ref:
        description: Test against core main or its latest release
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: sigrun-ai/sigrun/.github/actions/ext-test@main
        with:
          package-dir: ${{ inputs.package-dir }}
          needs-core: ${{ inputs.needs-core }}
          core-ref: ${{ inputs['core-ref'] }}
          repo: ${{ github.event.repository.name }}
