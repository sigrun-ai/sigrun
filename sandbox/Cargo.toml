[package]
name = "sigrun-sandbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apply a per-user Landlock policy and exec a confined command"

[dependencies]
landlock = "0.4.7"
nix = { version = "0.31.3", features = ["user", "process", "ptrace", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
panic = "abort"
lto = true

[dev-dependencies]
serde_json = "1.0.154"
