# Sigrun — example single-node compose deployment (publish prep 2.6).
#
# Mirrors what deploy/base/*.yaml expresses (deployment.yaml: one container,
# /healthz liveness, sqlite + workspace on one data volume; the pvc.yaml RWO
# shape becomes a single named volume here) but compose-shaped and env-driven
# via a .env file next to this one — see docker/README.md.
#
# This is the smoke / deploy-in-one-node path, not the production one: for a
# durable/persistent deployment use the Helm chart in charts/ (Helm chart)
# once the deploy/ base migration lands, or your own manifests. The
# historical deploy/ base manifests are in the middle of that migration.

services:
  sigrun:
    # The published image, TAG-PARAMETRIZED to the release appVersion (the
    # compose analogue of the chart's image.tag default). To run from a
    # local checkout instead, comment the image line and uncomment the
    # build stanza below:
    #   docker build -t sigrun:local .
    image: ghcr.io/sigrun-ai/sigrun:${SIGRUN_IMAGE_TAG:-0.3.0}
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    # The uid/gid the container runs as (spec §6): the 1000:1000 default
    # matches the image's USER, so the ENTRYPOINT execs straight through
    # (the non-root path — no privilege drop) and a fresh named volume
    # inherits node:node ownership from the image with no chown. Override
    # SIGRUN_UID/SIGRUN_GID to run as yourself when /data is already owned
    # by your uid; a NON-ROOT override keeps working the same way. Setting
    # SIGRUN_UID=0 (root start: the entrypoint chowns the mount points
    # then drops via setpriv) does NOT work with cap_drop ALL below — the
    # trampoline needs CAP_CHOWN to chown the mount points and
    # CAP_SETUID/CAP_SETGID for the setpriv drop, so a root start means
    # re-adding those three yourself. Note this is NOT an osUsers enabler:
    # one container still has one uid afterwards, so a root start buys
    # mount-point ownership, not per-user isolation.
    user: "${SIGRUN_UID:-1000}:${SIGRUN_GID:-1000}"
    # PID 1 reaping and signal forwarding are owned by the image's tini
    # ENTRYPOINT. The server spawns child processes (git, npm, agent
    # shells) whose orphans would otherwise accumulate as zombies under
    # a non-reaping node PID 1, so compose does not add Docker's init.
    # (A Docker init would also be placed ahead of the image ENTRYPOINT.)
    # No `init: true` here: the image provides exactly one init process.
    # Least privilege (spec §6): the server needs no Linux
    # capabilities, and nothing it starts may gain any (no-new-privileges
    # also blocks setuid binaries inside the image). Verified: with
    # no-new-privileges on, a non-root process exec'ing a
    # file-capability-carrying helper fails at the first privileged call
    # ("cannot set supplementary groups: EPERM"), even when SETUID/SETGID
    # are in the bounding set — so osUsers-style uid switching is
    # excluded here by construction, not by omission. This does NOT
    # affect the entrypoint's setpriv drop in a root start: that drops
    # privileges rather than gaining them, and works unchanged.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem (spec §6): the server writes ONLY under
    # /data (the named volume below), /cache and /tmp (the tmpfs mounts
    # below) — npm's cache included (NPM_CONFIG_CACHE=/cache/npm is
    # baked into the image, so boot's package installs land on tmpfs,
    # not the read-only layer). Everything else is immutable: a
    # compromised or runaway process cannot modify the image it runs
    # from.
    read_only: true
    # Run the BUILT deploy entry (dist/index.js) under plain node — no
    # npm in the signal path, so SIGTERM reaches the entry's graceful
    # shutdown (same rule as the Helm chart's container command). tsx is
    # dev-only (`npm start` from a source checkout).
    command: ["node", "dist/index.js"]
    working_dir: /app
    environment:
      # Required. An OpenAI-model id against the endpoint below, e.g.
      # openai/gpt-4o-mini — or a private gateway's own model id.
      # (SIGRUN_MODEL is the deprecated alias for one release cycle.)
      # The inner default is inert on purpose (`:-`, never `:?`): docker
      # compose evaluates NESTED defaults eagerly on some versions (the
      # runner's), so a `:?` inside `${A:-${B:?}}` errors even when A is
      # set. The fail-loud for a missing model lives in sigrun's own boot
      # (exit 1 naming SIGRUN_DEFAULT_MODEL) — compose-level duplication
      # of that message is what this replaces.
      SIGRUN_DEFAULT_MODEL: ${SIGRUN_DEFAULT_MODEL:-${SIGRUN_MODEL:-}}
      SIGRUN_PORT: "3000"
      # sqlite db + static workspace root on the data volume — mirrors the
      # deployment.yaml env block (WAL writes -wal/-shm sidecar files, so
      # the volume is mounted read-write).
      SIGRUN_STORAGE_PATH: /data/sigrun.db
      SIGRUN_WORKSPACE_PATH: /data/workspace
      # The config dir (settings.json + auth.json + the packages dir boot
      # installs extensions into) on the SAME data volume — one volume
      # total. Adding an extension = edit /data/config/settings.json
      # (packages[] + extensions[]) → docker compose restart; no rebuild.
      SIGRUN_CONFIG_DIR: /data/config
      # The store-dir contract (Tasks 1–7: explicit env used VERBATIM):
      # data + state are the durable buckets — subdirs of the data
      # volume below, alongside the db/workspace/config. Cache is the
      # regenerable root (spec §4 — never a backup section, a wipe is a
      # cold start) — pod-local, see the tmpfs mount below.
      SIGRUN_DATA_DIR: /data/data
      SIGRUN_CACHE_DIR: /cache
      SIGRUN_STATE_DIR: /data/state
      # The supervised posture (§13.3): compose's `restart:
      # unless-stopped` (below) brings the container back after an
      # intentional exit 0, so `POST /v1/admin/restart` (admin) is safe
      # to offer. A bare `docker run` of the image sets nothing and
      # reports not_supervised instead.
      SIGRUN_SUPERVISED: "1"
      # The degenerate env-provider path (spec §4.1): enough to run against
      # ANY OpenAI-compatible endpoint — OpenAI itself, a local
      # ramalama/ollama, or a remote/private gateway.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    # Operator-set vars, carried VERBATIM from docker/.env into the
    # container — SIGRUN_EXTENSIONS is the env-shaped extension fleet
    # override (§4.1: when set it REPLACES the settings file's
    # `extensions` list; env wins — sigrun core's contract). Deliberately
    # NOT a `SIGRUN_EXTENSIONS: ${SIGRUN_EXTENSIONS:-}` environment
    # entry: that interpolation renders an EMPTY string when .env omits
    # the var, and parseExtensionList("") is an empty list (not unset) —
    # an empty fleet would be pinned OVER the settings file, breaking
    # the file-driven flow in the README. env_file passes a var through
    # only when the file declares it (absent otherwise — the same shape
    # as the chart's envFrom secretRef), so unset means the settings
    # file drives the fleet. NOT required — `docker compose up` without
    # a .env boots the file-driven config with the public OpenAI default
    # base URL; required:false keeps compose from erroring on the
    # missing file.
    env_file:
      - path: .env
        required: false
    ports:
      - "${SIGRUN_PORT:-3000}:3000"
    volumes:
      - sigrun-data:/data
    # Cache and /tmp are pod-local tmpfs (the compose analogue of the
    # chart's emptyDir): tmpfs rather than an anonymous volume, because
    # their lifetime should die WITH the container (no
    # /var/lib/docker/volumes residue to accumulate a regenerable root) —
    # /tmp is the read_only scratch dir, /cache the regenerable root
    # (spec §4: never a backup section, a wipe is a cold start);
    # data/state stay on the named sigrun-data volume, cache never
    # touches it.
    tmpfs:
      - /tmp
      - /cache
    healthcheck:
      # Same /healthz liveness probe as deploy/base/deployment.yaml. The
      # node:22-slim image ships no curl/wget, so a node one-liner fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 195s

volumes:
  # The sqlite + workspace data — the compose analogue of the sigrun-data PVC.
  # Ownership: the image runs as the node user (uid 1000, spec §6.10) and
  # /data is chowned node:node in the image, so a FRESH named volume
  # inherits that ownership from the image dir on first mount — the
  # non-root server can write it with no manual chown. If you pre-seed the
  # volume from a host path or restore into it, chown -R 1000:1000 it
  # first (a root-owned tree would make the server fail its storage
  # writes).
  sigrun-data:
