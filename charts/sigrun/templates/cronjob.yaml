{{/*
Sigrun nightly backup CronJob (spec §4.3).

Contract:
- Nightly `sqlite3 .backup` against the LIVE harness database — the
  online-safe backup API, consistent while the harness holds the db in WAL
  mode (verified live by test/backup.test.ts's restore drill, App C).
- Image carries `sqlite3` plus the target's client (`aws` CLI for s3) AND
  tsx (the script's runtime — the repo's internal imports use .js
  specifiers resolving to .ts files, which stock node does not resolve).
- Target credentials are CORE secrets, injected from the backup Secret
  (values.secret.envName on the backup container).
- Retention (30 days, path target) and fail-loud exit codes live in the
  script itself (src/backup/run-backup.ts); a failed job is visible as a
  failed CronJob batch, not a silent no-backup.
*/}}
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sigrun.fullname" . }}-backup
  labels:
    {{- include "sigrun.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  # Nightly at 03:00 (cluster local time).
  schedule: {{ .Values.backup.schedule | quote }}
  # One run at a time; skip if the previous is still running (a slow upload
  # must not stack a second sqlite pass on the same target).
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "sigrun.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: {{ .Values.backup.restartPolicy }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}{{ if .Values.backup.image.tag }}:{{ .Values.backup.image.tag }}{{ else }}:{{ .Chart.AppVersion }}{{ end }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              command:
                - npx
                - tsx
                - /app/src/backup/run-backup.ts
              envFrom:
                # Core backup secret (spec §4.3): SIGRUN_BACKUP_PATH or
                # SIGRUN_BACKUP_S3_BUCKET/PREFIX, AWS_* credentials, and
                # SIGRUN_BACKUP_S3_ENDPOINT for an S3-compatible store.
                - secretRef:
                    name: {{ .Values.backup.secret.envName }}
              env:
                # The db under backup: the same PVC the Deployment mounts.
                - name: SIGRUN_STORAGE_PATH
                  value: {{ .Values.sigrun.storage.path | quote }}
                {{- range $name, $value := .Values.backup.env }}
                - name: {{ $name }}
                  value: {{ $value | quote }}
                {{- end }}
              volumeMounts:
                # The sqlite PVC the Deployment mounts. Mounted read-WRITE
                # even though the script never writes the db: reading a WAL
                # database requires lock access to its -shm/-wal sidecar
                # files, which a read-only volume mount blocks.
                - name: {{ .Values.persistence.name }}
                  mountPath: /data
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            {{- if .Values.persistence.enabled }}
            - name: {{ .Values.persistence.name }}
              persistentVolumeClaim:
                claimName: {{ include "sigrun.dataPVCName" . }}
            {{- else }}
            # persistence disabled: backup against the Deployment's own
            # ephemeral volume — dev/test shape only (and a path target,
            # not s3, or the backup uploads from a volume that dies with
            # the pod).
            - name: {{ .Values.persistence.name }}
              emptyDir: {}
            {{- end }}
          {{- with .Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}