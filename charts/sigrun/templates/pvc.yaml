{{/*
Sigrun sqlite PVC (spec §4.3/§4.4) — RWO block-like storage.

The storage class must provide block semantics (safe for sqlite WAL — a
local-path provisioner satisfies §4.3 but binds the pod to one node, which
is why the backup CronJob accepts its own placement values).
*/}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sigrun.dataPVCName" . }}
  labels:
    {{- include "sigrun.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}