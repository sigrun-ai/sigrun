{{/*
Sigrun Services (spec §4.4): the in-cluster ClusterIP (what the
ServiceMonitor scrapes) is the base contract; the optional Tailscale
LoadBalancer Service is a values toggle.

The ServiceMonitor selects Services by {name, component: server}, so the
Tailscale LB Service deliberately carries component: tailscale-lb — a
second Service with the {name, component: server} pair would become a
second scrape target to the same pods (double scrapes / duplicated up{}
series).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sigrun.fullname" . }}
  labels:
    {{- include "sigrun.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sigrun.componentLabels" (dict "Chart" .Chart "Values" .Values "Release" .Release "component" "server") | nindent 4 }}
{{- if .Values.service.tailscale.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sigrun.fullname" . }}-tailscale
  labels:
    {{- include "sigrun.labels" . | nindent 4 }}
    # Distinct component: the ServiceMonitor's matchLabels must NOT match.
    app.kubernetes.io/component: tailscale-lb
  annotations:
    tailscale.com/hostname: {{ .Values.service.tailscale.hostname | quote }}
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  # Pod selector still targets the server pods; only the metadata labels
  # differ from the ClusterIP Service.
  selector:
    {{- include "sigrun.componentLabels" (dict "Chart" .Chart "Values" .Values "Release" .Release "component" "server") | nindent 4 }}
{{- end }}