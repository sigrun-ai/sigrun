{{/*
Sigrun observability (spec §4.4) — M1 metrics scoping.

A real /metrics endpoint with §4.4's wedged-state gauges is a follow-up,
NOT M1. In M1 the readiness probe IS the scrape target: GET /readyz
answers 200 with a single Prometheus-exposition gauge line when ready, 503
when not — so a degraded harness (T9e memory/provider health) or an
unreachable storage line collapses into a failed scrape (up == 0), which
the PrometheusRule alerts on. /v1/meta stays the JSON human/debug surface
— not scrapeable.

- jobLabel: the job label takes the Service's app.kubernetes.io/name value
  ("sigrun"), so the rule expressions can match job="sigrun".
- The release label (what a kube-prometheus-stack Prometheus selects
  monitors/rules by) is a consumer concern — monitoring.labels.
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sigrun.fullname" . }}
  labels:
    {{- include "sigrun.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sigrun.name" . }}
      app.kubernetes.io/component: server
  endpoints:
    - port: http
      path: /readyz
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sigrun.fullname" . }}
  labels:
    {{- include "sigrun.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: sigrun
      rules:
        - alert: SigrunNotReady
          # Degraded T9e health ⇒ /readyz 503 ⇒ up == 0, so
          # "meta-degraded" folds into SigrunNotReady: process down OR
          # harness not ready (storage unreachable, memory/provider health
          # degraded).
          expr: up{job="{{ include "sigrun.name" . }}"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: sigrun scrape failing (process down or harness not ready)
            description: >-
              The sigrun /readyz scrape has failed for 10m — the process is
              down, or readiness is failing (storage read, memory/provider
              health). Check the pod and GET /v1/meta for the health block.
        - alert: SigrunNoScrape
          # The series is absent for 30m — the ServiceMonitor/Prometheus
          # wiring itself broke (SigrunNotReady cannot fire when nothing
          # scrapes the target, so the absence needs its own signal).
          expr: absent(up{job="{{ include "sigrun.name" . }}"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: sigrun is not being scraped
            description: >-
              No up{job="sigrun"} series for 30m — the ServiceMonitor or
              Prometheus discovery wiring broke (SigrunNotReady cannot
              fire when nothing scrapes the target).
{{- end }}