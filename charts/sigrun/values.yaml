# Default values for the sigrun chart (bjw-s common 5.2.1 wrapper).
#
# These are the PORTABLE defaults (spec §4.4): a public-release user renders
# this chart with only a Secret and an image and gets a working deployment.
# Homelab specifics (Tailscale LB, iSCSI storage class, RustFS backup
# endpoint, worker placement) are values OVERRIDES — see the consumer's
# GitOps repo (flux-app-llm/sigrun), not this file.

# -- Chart-wide settings (propagated by the bjw-s loader).
global:
  # -- (string) Set the chart name
  nameOverride: null
  # -- (string) Set the chart fullname definition
  fullnameOverride: null

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name (release-chart otherwise).
fullnameOverride: ""

controllers:
  main:
    # -- Controller type.
    type: deployment
    # -- Single replica — sqlite is one process's live database.
    replicas: 1
    # Recreate is forced (not a value): the sqlite PVC is ReadWriteOnce —
    # a RollingUpdate starts the replacement while the old pod still holds
    # the volume, and two pods deadlock on one RWO PVC (spec §4.4).
    strategy: Recreate
    # -- (optional) PodDisruptionBudget for the server controller.
    podDisruptionBudget: null
    # Pod security context (spec §6.10): the image runs as the base
    # image's node user (uid/gid 1000) — runAsNonRoot refuses a root
    # schedule, fsGroup 1000 makes the kubelet chown the sigrun-data PVC
    # to the same uid on mount.
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    containers:
      main:
        image:
          # The sigrun image: must carry Node >= 22.19 (node:sqlite), the
          # repo at /app with node_modules, and the BUILT tree — dist/ (the
          # core tsc build, chained with the shared workspace build) and
          # webui/dist (the vite bundle). tsx is dev-only (from-source
          # runs); the runtime is plain node against dist/.
          repository: REPLACEME-node22-sigrun-image
          # -- Image tag (defaults to the chart appVersion).
          tag: ""
          # -- Image pull policy.
          pullPolicy: IfNotPresent
        # The deploy entry's BUILT form (dist/index.js), run under plain
        # node — direct, no npm in the signal path, so SIGTERM reaches the
        # entry's graceful shutdown (server close, event-bus drain, harness
        # close, exit 0).
        command:
          - node
          - dist/index.js
        # The relative `dist/index.js` resolves against this directory, not
        # the image's WORKDIR convention — pin it so the contract is in the
        # manifest, not the image.
        workingDir: /app
        env:
          # Wired to the chart's own volume: the db lives on the PVC.
          - name: SIGRUN_STORAGE_PATH
            value: /data/sigrun.db
          # The static workspace root (spec §4.5): on the same PVC in the
          # base shape (a separate artifacts volume is a values choice).
          - name: SIGRUN_WORKSPACE_PATH
            value: /data/workspace
          # The config dir (settings.json + auth.json + the packages dir)
          # on the SAME PVC: extensions are declared in settings.json
          # (packages[] installs, extensions[] loads) and boot installs
          # them into /data/config/packages — no image rebuild to add an
          # extension, and the chart bakes none. Change flow: edit the
          # file (kubectl exec into the pod, or your own PVC seeding),
          # then rollout restart. (An initContainer seeding a first-boot
          # settings.json from a ConfigMap is a deployment choice — the
          # chart deliberately does not implement one.)
          - name: SIGRUN_CONFIG_DIR
            value: /data/config
          # The store-dir contract (Tasks 1–7: the explicit env is used
          # VERBATIM, stores.ts tier 1): data + state are the durable
          # buckets — subdirs of the /data PVC mount, next to the db,
          # workspace, and config above. Cache is the regenerable root:
          # pod-local emptyDir (see persistence.cache below), NEVER on
          # the PVC (spec §4 — a wiped cache is a cold start, not a
          # restore event, and cache is never a backup section).
          - name: SIGRUN_DATA_DIR
            value: /data/data
          - name: SIGRUN_CACHE_DIR
            value: /cache
          - name: SIGRUN_STATE_DIR
            value: /data/state
          # Must match the service.main port.
          - name: SIGRUN_PORT
            value: "3000"
          # W2 Task 8 (spec §6.9): keep the metrics scrape public. The
          # ServiceMonitor below scrapes in-cluster; this pins the W1
          # `metricsPublic` gate (strict true/false env, default false)
          # true so the scrape keeps working once W1's auth pipeline
          # lands — an operator who wants the pipeline to guard /metrics
          # flips this to "false" and fronts the scrape with a principal.
          - name: SIGRUN_METRICS_PUBLIC
            value: "true"
        envFrom:
          # Everything else config-shaped comes from the Secret
          # (envFrom): SIGRUN_DEFAULT_MODEL (required; SIGRUN_MODEL
          # deprecated), OPENAI_API_KEY / OPENAI_BASE_URL (the degenerate
          # env provider) or extension
          # provider creds, and the SIGRUN_EXTENSIONS package list (§4.1).
          # All extension env lives there too — extensions read the whole
          # environment (§4.4: "every enabled extension can read every env
          # secret").
          #
          # Auth (core hardening W1): the container's non-loopback bind
          # makes ["token"] the effective default, so a deployment either
          # drives onboarding (GET /v1/onboarding + claim) or pins a
          # service token. The auth keys live in the same sigrun-env
          # Secret, e.g.:
          #   SIGRUN_API_TOKEN=sgr_...   # env service token (admin,
          #                               # outside the user directory)
          #   SIGRUN_PROXY_SECRET=...    # forward-auth shared secret
          #                               # (proxy method)
          # Upgrade note: an existing deployment upgrades into onboarding
          # (the setup code is in the pod log and /cache/setup-code).
          - secretRef:
              name: sigrun-env
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        probes:
          # /healthz: process-up, always 200 once listening; /readyz:
          # harness-ready — T9e health not degraded + a real storage read;
          # 503 otherwise (spec §4.4 observability).
          liveness:
            enabled: true
            type: HTTP
            path: /healthz
            port: http
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /readyz
            port: http
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          # Placeholder requests/limits — tune against observed usage;
          # nothing in the chart depends on them.
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi

  backup:
    # -- Nightly backup CronJob (spec §4.3). Disabled by default in the
    # public shape (an image carrying sqlite3 + the target client is
    # a deliberate choice; a deployment that skips backup has ZERO disaster
    # copies of transcripts — accepted choice, not a supported recovery
    # posture §4.4). The homelab instantiation enables it.
    enabled: false
    type: cronjob
    cronjob:
      # -- Cron schedule (cluster local time).
      schedule: "0 4 * * *"
      # One run at a time; skip if the previous is still running (a slow
      # upload must not stack a second sqlite pass on the same target).
      concurrencyPolicy: Forbid
      successfulJobsHistory: 3
      failedJobsHistory: 7
      backoffLimit: 1
    # Same pod security pin as the main controller (spec §6.10): uid 1000,
    # non-root — the backup job writes tars + the sqlite copy to the SAME
    # PVC the fsGroup chowns to 1000.
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    containers:
      backup:
        image:
          # Must carry sqlite3 + awscli (the target's client); the backup
          # script runs as the BUILT dist/backup/run-backup.js under plain
          # node — no tsx (dev-only, from-source runs).
          repository: REPLACEME-sqlite3-awscli-image
          tag: ""
          pullPolicy: IfNotPresent
        # Nightly `sqlite3 .backup` against the LIVE harness database —
        # the online-safe backup API (consistent while the harness holds
        # the db in WAL mode, verified live by test/backup.test.ts's
        # restore drill, App C). Retention (30 days, path target) and
        # fail-loud exit codes live in the script itself.
        command:
          - node
          - /app/dist/backup/run-backup.js
        env:
          # The db under backup: the same PVC the Deployment mounts.
          - name: SIGRUN_STORAGE_PATH
            value: /data/sigrun.db
          # Per-section opt-in (Task 7): comma list of
          # config,secrets,data,state to ALSO tar the named store roots
          # into <target>/<section>-<UTC timestamp>.tar.gz (secrets
          # tarball mode 0600; cache is NEVER a valid section). Absent /
          # empty = DB-only backup, the default.
          - name: SIGRUN_BACKUP_SECTIONS
            value: ""
          # The store dirs the sections resolve through
          # (resolveStoreRoots tier 1 — the same values as the
          # Deployment): without them the CronJob pod resolves
          # configDir to the image's /root/.config/sigrun and tars
          # nonexistent dirs when sections are enabled. Cache is
          # deliberately absent — never a backup section, so its root
          # is never resolved on this path.
          - name: SIGRUN_CONFIG_DIR
            value: /data/config
          - name: SIGRUN_DATA_DIR
            value: /data/data
          - name: SIGRUN_STATE_DIR
            value: /data/state
        envFrom:
          # Core backup secret (spec §4.3): SIGRUN_BACKUP_PATH or
          # SIGRUN_BACKUP_S3_BUCKET/PREFIX, AWS_* credentials, and
          # SIGRUN_BACKUP_S3_ENDPOINT for an S3-compatible store.
          - secretRef:
              name: sigrun-backup
        resources:
          # Modest — a nightly sqlite copy + one upload.
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

service:
  main:
    # -- The controller this Service fronts (two controllers exist: main +
    # backup; automatic detection cannot pick).
    controller: main
    # -- Service type. The base contract is the in-cluster ClusterIP (what
    # the ServiceMonitor scrapes); external reach (ingress, Tailscale LB,
    # port-forward) is a values choice, not a core contract.
    type: ClusterIP
    # -- Annotations passthrough on the Service (e.g. Tailscale LB class
    # via a second Service entry — homelab concern).
    annotations: {}
    ports:
      http:
        # -- Service port (must match SIGRUN_PORT).
        port: 3000
        targetPort: http

ingress:
  # Ingress disabled by default — the homelab reaches sigrun via a
  # Tailscale LoadBalancer Service (a values-added Service entry), not
  # ingress.
  main:
    enabled: false

persistence:
  data:
    # -- Create the sqlite PVC. sqlite on block-like storage (spec §4.3) —
    # the class must provide block semantics (safe for WAL); a local-path
    # provisioner satisfies §4.3 but binds the pod to one node.
    enabled: true
    type: persistentVolumeClaim
    # -- Storage request.
    size: 5Gi
    # -- Storage class ("" = cluster default). Must be block-like for WAL.
    storageClass: ""
    # -- Access mode — RWO, and the Deployment pins Recreate for it.
    accessMode: ReadWriteOnce
    # -- Name suffix: the single persistence item would otherwise drop its
    # identifier suffix and name the PVC plain "sigrun" — keep the old
    # chart's sigrun-data name (the Deployment + CronJob both reference
    # claimName sigrun-data).
    suffix: data
    # Mounted at /data in every container (main + backup — the backup job
    # needs lock access to the -shm/-wal sidecar files).
    globalMounts:
      - path: /data

  cache:
    # -- Pod-local cache volume: the SIGRUN_CACHE_DIR mount. Cache is
    # regenerable + self-cleaning (spec §4) — it NEVER touches the PVC
    # (a wiped cache is a cold start, not a restore event; boot never
    # ensures the cache root, every consumer repairs it at call time)
    # and is never a backup section, so emptyDir is the whole story.
    enabled: true
    type: emptyDir
    # Mounted at /cache in every container (globalMounts mirrors the
    # data entry's shape). Inert for the backup CronJob — cache is
    # never a backup section (Task 7).
    globalMounts:
      - path: /cache

serviceMonitor:
  # -- M1 observability (spec §4.4) + W2 Task 8 (spec §6.9): the scrape
  # target is the full `GET /metrics` exposition (the readiness probe's
  # single gauge line was the M1 stand-in). The PrometheusRule's
  # sigrun_* alerts key on the exposition families.
  main:
    enabled: false
    # -- Extra labels on the ServiceMonitor (e.g. release:
    # kube-prometheus-stack — what a kube-prometheus-stack Prometheus
    # selects monitors by; a consumer concern).
    labels: {}
    # -- Selector for the Service(s) to scrape. Defaults to the chart's own
    # main Service.
    selector: {}
    # -- The /metrics scrape endpoint.
    endpoints:
      - port: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

monitoring:
  # -- Hand-rendered PrometheusRule (bjw-s 5.2.1 has no PrometheusRule
  # class). Gated independently of serviceMonitor.
  prometheusRule:
    enabled: false
    # -- Extra labels on the PrometheusRule (e.g. release:
    # kube-prometheus-stack; a consumer concern).
    labels: {}

# Topology/tolerations/nodeSelector: leave at bjw-s app-template defaults —
# placement is a values override at the consumer
# (controllers.main.pod / controllers.backup.pod in the homelab repo).
