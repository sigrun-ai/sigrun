apiVersion: v2
name: sigrun
description: >-
  Sigrun — durable personal assistant harness (Node + harness + webui) with
  sqlite storage, nightly backup, and readiness-scraped observability.
  Reference deployment for the sigrun core (spec §4.4): single replica,
  Recreate strategy, RWO block-like PVC for sqlite, ClusterIP Service.
type: application
# version  — the CHART's own packaging version, set from the chart-v<semver>
#            tag by chart-release.yml. Advances independently of the core
#            (so a chart-only fix does not need a core release).
# appVersion — the CORE release this chart deploys; its default image tag.
#            Bumped WITH the core family (the in-tree value tracks the current
#            core version), and re-derived from package.json at the tagged
#            commit by the release workflow — not checked against
#            `version` (they are deliberately independent).
version: 0.3.0
appVersion: "0.3.0"
keywords:
  - assistant
  - agent
  - llm
home: https://github.com/sigrun-ai/sigrun
sources:
  - https://github.com/sigrun-ai/sigrun
icon: https://raw.githubusercontent.com/sigrun-ai/sigrun/main/charts/sigrun/icon.svg
maintainers:
  - name: sigrun-ai
    url: https://github.com/sigrun-ai
dependencies:
  - name: common
    version: 5.2.1
    repository: https://bjw-s-labs.github.io/helm-charts/
