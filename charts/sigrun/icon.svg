<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="sigrun">
	<!-- The chart's icon. A minimal mark in the webui's accent colour
	     (--accent: #d6a24a): a rune-like vertical with two arms, evoking
	     both a signal and the "r" of the name. No wordmark, no gradient —
	     it has to read at 32px in a Helm repo listing. -->
	<rect width="64" height="64" rx="14" fill="#12161c" />
	<path
		d="M22 46V18h13a9 9 0 0 1 0 18h-9"
		fill="none"
		stroke="#d6a24a"
		stroke-width="6"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<path d="M33 36l10 10" fill="none" stroke="#d6a24a" stroke-width="6" stroke-linecap="round" />
</svg>
